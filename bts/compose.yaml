x-osmocom: &osmocom
  image: pmb887x-bts
  build: .
  pull_policy: build
  network_mode: service:net
  restart: unless-stopped
  env_file:
    - .env.default
    - path: .env
      required: false
  volumes:
    - ./config:/etc/osmocom:ro
    - ./services:/opt/services:ro

services:
  net:
    image: pmb887x-bts
    build: .
    pull_policy: build
    restart: unless-stopped
    init: true
    command: sh -c "nft -f /etc/osmocom/nat.nft && exec sleep infinity"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - ${TRXMUX_ADDRESS:-127.0.0.1}:${TRXMUX_PORT:-5750}:5750/udp
    volumes:
      - ./config:/etc/osmocom:ro
  stp:
    <<: *osmocom
    command: osmo-stp -c /etc/osmocom/osmo-stp.cfg
  hlr:
    <<: *osmocom
    command: osmo-hlr -c /etc/osmocom/osmo-hlr.cfg
  mgw:
    <<: *osmocom
    command: osmo-mgw -c /etc/osmocom/osmo-mgw.cfg
  msc:
    <<: *osmocom
    command: sh -c 'python3 /opt/services/render_config.py msc /run/osmo-msc.cfg && exec osmo-msc -c /run/osmo-msc.cfg'
  cbc:
    <<: *osmocom
    command: osmo-cbc -c /etc/osmocom/osmo-cbc.cfg
  bsc:
    <<: *osmocom
    command: sh -c 'python3 /opt/services/render_config.py bsc /run/osmo-bsc.cfg && exec osmo-bsc -c /run/osmo-bsc.cfg'
  cells:
    <<: *osmocom
    command: python3 /opt/services/cells.py
  trxmux:
    <<: *osmocom
    command: python3 /opt/trxmux/trxmux.py
    volumes:
      - ./trxmux:/opt/trxmux:ro
  provision:
    <<: *osmocom
    command: python3 /opt/services/provision.py
  mmsc:
    <<: *osmocom
    command: python3 /opt/services/mmsc.py
    volumes:
      - ./services:/opt/services:ro
      - mmsc-state:/var/lib/mmsc
  sgsn:
    <<: *osmocom
    command: sh -c 'python3 /opt/services/render_config.py sgsn /run/osmo-sgsn.cfg && exec osmo-sgsn -c /run/osmo-sgsn.cfg'
  ggsn:
    <<: *osmocom
    command: osmo-ggsn -c /etc/osmocom/osmo-ggsn.cfg
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

volumes:
  mmsc-state:
