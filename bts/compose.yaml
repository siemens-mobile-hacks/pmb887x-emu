x-osmocom: &osmocom
  image: pmb887x-bts
  build: .
  pull_policy: build
  network_mode: service:net
  restart: unless-stopped
  volumes:
    - ./config:/etc/osmocom:ro

services:
  net:
    image: pmb887x-bts
    build: .
    pull_policy: build
    restart: unless-stopped
    init: true
    command: sh -c "nft -f /etc/osmocom/nat.nft && exec sleep infinity"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - 127.0.0.1:5750:5750/udp
    volumes:
      - ./config:/etc/osmocom:ro
  stp:
    <<: *osmocom
    command: osmo-stp -c /etc/osmocom/osmo-stp.cfg
  hlr:
    <<: *osmocom
    command: osmo-hlr -c /etc/osmocom/osmo-hlr.cfg
  mgw:
    <<: *osmocom
    command: osmo-mgw -c /etc/osmocom/osmo-mgw.cfg
  msc:
    <<: *osmocom
    command: osmo-msc -c /etc/osmocom/osmo-msc.cfg
  cbc:
    <<: *osmocom
    command: osmo-cbc -c /etc/osmocom/osmo-cbc.cfg
  bsc:
    <<: *osmocom
    command: osmo-bsc -c /etc/osmocom/osmo-bsc.cfg
  trxmux:
    <<: *osmocom
    command: python3 /opt/trxmux/trxmux.py
    volumes:
      - ./trxmux:/opt/trxmux:ro
  bts:
    <<: *osmocom
    command: osmo-bts-trx -c /etc/osmocom/osmo-bts-trx.cfg
    volumes:
      - ./config:/etc/osmocom:ro
      - pcu-socket:/tmp
  pcu:
    <<: *osmocom
    command: osmo-pcu -c /etc/osmocom/osmo-pcu.cfg
    volumes:
      - ./config:/etc/osmocom:ro
      - pcu-socket:/tmp
  sgsn:
    <<: *osmocom
    command: osmo-sgsn -c /etc/osmocom/osmo-sgsn.cfg
  ggsn:
    <<: *osmocom
    command: osmo-ggsn -c /etc/osmocom/osmo-ggsn.cfg
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

volumes:
  pcu-socket:
