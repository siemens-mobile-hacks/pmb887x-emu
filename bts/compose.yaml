x-osmocom: &osmocom
  image: pmb887x-bts
  build: .
  pull_policy: build
  network_mode: service:net
  restart: unless-stopped
  volumes:
    - ./config:/etc/osmocom:ro

x-cell: &cell
  <<: *osmocom
  volumes:
    - ./config:/etc/osmocom:ro
    - pcu-socket:/tmp

x-bts: &bts
  <<: *cell
  command: sh -c 'sed "s/@CELL@/$$CELL/g" /etc/osmocom/osmo-bts-trx.cfg > /run/osmo-bts-trx.cfg && exec osmo-bts-trx -c /run/osmo-bts-trx.cfg'

x-pcu: &pcu
  <<: *cell
  command: sh -c 'sed "s/@CELL@/$$CELL/g" /etc/osmocom/osmo-pcu.cfg > /run/osmo-pcu.cfg && exec osmo-pcu -c /run/osmo-pcu.cfg'

services:
  net:
    image: pmb887x-bts
    build: .
    pull_policy: build
    restart: unless-stopped
    init: true
    command: sh -c "nft -f /etc/osmocom/nat.nft && exec sleep infinity"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - 127.0.0.1:5750:5750/udp
    volumes:
      - ./config:/etc/osmocom:ro
  stp:
    <<: *osmocom
    command: osmo-stp -c /etc/osmocom/osmo-stp.cfg
  hlr:
    <<: *osmocom
    command: osmo-hlr -c /etc/osmocom/osmo-hlr.cfg
  mgw:
    <<: *osmocom
    command: osmo-mgw -c /etc/osmocom/osmo-mgw.cfg
  msc:
    <<: *osmocom
    command: osmo-msc -c /etc/osmocom/osmo-msc.cfg
  cbc:
    <<: *osmocom
    command: osmo-cbc -c /etc/osmocom/osmo-cbc.cfg
  bsc:
    <<: *osmocom
    command: osmo-bsc -c /etc/osmocom/osmo-bsc.cfg
  trxmux:
    <<: *osmocom
    command: python3 /opt/trxmux/trxmux.py
    volumes:
      - ./trxmux:/opt/trxmux:ro
  provision:
    <<: *osmocom
    command: python3 /opt/services/provision.py
    volumes:
      - ./services:/opt/services:ro
  mmsc:
    <<: *osmocom
    command: python3 /opt/services/mmsc.py
    volumes:
      - ./services:/opt/services:ro
      - mmsc-state:/var/lib/mmsc
  bts0:
    <<: *bts
    environment:
      CELL: 0
  pcu0:
    <<: *pcu
    environment:
      CELL: 0
  bts1:
    <<: *bts
    environment:
      CELL: 1
  pcu1:
    <<: *pcu
    environment:
      CELL: 1
  bts2:
    <<: *bts
    environment:
      CELL: 2
  pcu2:
    <<: *pcu
    environment:
      CELL: 2
  bts3:
    <<: *bts
    environment:
      CELL: 3
  pcu3:
    <<: *pcu
    environment:
      CELL: 3
  sgsn:
    <<: *osmocom
    command: osmo-sgsn -c /etc/osmocom/osmo-sgsn.cfg
  ggsn:
    <<: *osmocom
    command: osmo-ggsn -c /etc/osmocom/osmo-ggsn.cfg
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

volumes:
  pcu-socket:
  mmsc-state:
