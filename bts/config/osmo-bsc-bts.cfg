 bts @CELL@
  type osmo-bts
  band GSM900
  base_station_id_code 0
  location_area_code 1
  cell_identity @CELL@
  ipa unit-id @UNIT_ID@ 0
  gprs mode gprs
  gprs routing area 0
  gprs cell bvci @BVCI@
  gprs nsei @NSEI@
  gprs nsvc 0 nsvci @NSEI@
  gprs nsvc 0 local udp port @NSVC_PORT@
  gprs nsvc 0 remote ip 127.0.0.1
  gprs nsvc 0 remote udp port 23001
  trx 0
   rf_locked 0
   arfcn @ARFCN@
   rsl e1 tei 0
   timeslot 0
    phys_chan_config CCCH+SDCCH4
   timeslot 1
    phys_chan_config SDCCH8+CBCH
   timeslot 2
    phys_chan_config DYNAMIC/OSMOCOM
   timeslot 3
    phys_chan_config DYNAMIC/OSMOCOM
   timeslot 4
    phys_chan_config DYNAMIC/OSMOCOM
   timeslot 5
    phys_chan_config DYNAMIC/OSMOCOM
   timeslot 6
    phys_chan_config PDCH
   timeslot 7
    phys_chan_config PDCH
